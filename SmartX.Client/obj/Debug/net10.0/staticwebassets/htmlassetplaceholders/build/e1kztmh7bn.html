    <script>
            window.renderTruckMap = (lat, lng, popupText) => {
                const mapContainer = document.getElementById('truckMapContainer');
                if (!mapContainer) return;

                // Destroy existing map instance to prevent duplicate binding errors on rerender
                if (window.truckMapInstance) {
                    window.truckMapInstance.remove();
                }

                // Initialize Leaflet map centered at truck coordinates
                window.truckMapInstance = L.map('truckMapContainer').setView([lat, lng], 13);

                // Load OpenStreetMap tile layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors'
                }).addTo(window.truckMapInstance);

                // Place marker at truck location with popup
                L.marker([lat, lng])
                 .addTo(window.truckMapInstance)
                 .bindPopup(`<b>${popupText}</b>`)
                 .openPopup();
            };
    </script>
